<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldJute" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#D4A359" />
      <stop offset="100%" stop-color="#9D713A" />
    </linearGradient>
    <linearGradient id="ecoGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E332B" />
      <stop offset="100%" stop-color="#0A1410" />
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&amp;display=swap');
      .brand-title {
        font-family: 'Poppins', sans-serif;
        font-weight: 800;
        font-size: 27px;
        letter-spacing: 0.04em;
        fill: #FFFFFF;
      }
      .brand-title-accent {
        fill: url(#goldJute);
      }
      .brand-sub {
        font-family: 'Poppins', sans-serif;
        font-weight: 600;
        font-size: 11px;
        letter-spacing: 0.32em;
        fill: #CAA875;
      }
      .brand-meta {
        font-family: 'Poppins', sans-serif;
        font-weight: 500;
        font-size: 8.5px;
        letter-spacing: 0.16em;
        fill: #9CA3AF;
      }
    </style>
  </defs>

  <!-- ICON SECTION (LEFT) -->
  <g transform="translate(10, 8)">
    <rect x="0" y="0" width="84" height="84" rx="22" fill="url(#shieldGrad)" stroke="url(#goldJute)" stroke-width="2" />
    
    <!-- Pattern Corners -->
    <path d="M12 12 L20 12 M64 12 L72 12 M12 72 L20 72 M64 72 L72 72" stroke="#CAA875" stroke-width="1.2" stroke-linecap="round" opacity="0.7" />

    <!-- Interlocking NB / Weave & Leaf -->
    <g transform="translate(7, 7)">
      <path d="M12 28 C 12 18, 24 12, 35 12 C 46 12, 58 18, 58 28 C 58 42, 35 46, 35 58" fill="none" stroke="url(#goldJute)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M35 14 L35 58" fill="none" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
      <path d="M58 40 C 58 52, 46 58, 35 58 C 24 58, 12 52, 12 40" fill="none" stroke="url(#goldJute)" stroke-width="4.5" stroke-linecap="round" />
      <path d="M35 28 C 47 28, 55 33, 55 42 C 55 50, 47 56, 35 56" fill="none" stroke="#FBBF24" stroke-width="3.5" stroke-linecap="round" />
      
      <!-- Green Leaf Accent -->
      <path d="M35 12 C 35 2, 47 -2, 53 2 C 53 10, 43 14, 35 12 Z" fill="url(#ecoGreen)" />
      
      <!-- Cross Weave Threads -->
      <line x1="22" y1="34" x2="48" y2="34" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8" />
      <line x1="24" y1="44" x2="46" y2="44" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    </g>
  </g>

  <!-- TEXT BRANDING SECTION (RIGHT) -->
  <g transform="translate(112, 0)">
    <!-- Main Title -->
    <text x="0" y="44" class="brand-title">
      NORTH BENGAL
    </text>

    <!-- Subtitle (HANDMADE PRODUCTS BD) -->
    <text x="1" y="66" class="brand-sub">
      HANDMADE PRODUCTS BD
    </text>

    <!-- Bottom Metadata Strip -->
    <g transform="translate(1, 82)">
      <circle cx="3" cy="-3" r="2.5" fill="#10B981" />
      <text x="12" y="0" class="brand-meta">
        ESTD. 2022 • GOVT. VERIFIED EXPORTER • BANGLADESH
      </text>
    </g>
  </g>
</svg>
