<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldJute" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="45%" stop-color="#D4A359" />
      <stop offset="100%" stop-color="#9D713A" />
    </linearGradient>
    <linearGradient id="ecoGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172721" />
      <stop offset="100%" stop-color="#0C1411" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield / Squircle -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#shieldGrad)" stroke="url(#goldJute)" stroke-width="2" />
  
  <!-- Outer Weave Pattern Accent Marks -->
  <path d="M22 18 L34 18 M66 18 L78 18 M22 82 L34 82 M66 82 L78 82" stroke="#CAA875" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />

  <!-- Central Interlocking NB Weave & Leaf Icon -->
  <g transform="translate(14, 14)">
    <!-- Loom Warp & Weft Lines (Subtle Jute Texture) -->
    <path d="M12 28 C 12 18, 26 12, 36 12 C 46 12, 60 18, 60 28 C 60 42, 36 46, 36 58" fill="none" stroke="url(#goldJute)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M36 14 L36 58" fill="none" stroke="#FDE68A" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <path d="M60 40 C 60 52, 48 58, 36 58 C 24 58, 12 52, 12 40" fill="none" stroke="url(#goldJute)" stroke-width="5" stroke-linecap="round" />
    
    <!-- Stylized "B" loop -->
    <path d="M36 28 C 48 28, 56 34, 56 42 C 56 50, 48 56, 36 56" fill="none" stroke="#FBBF24" stroke-width="4" stroke-linecap="round" />

    <!-- Organic Eco Leaf crowning the knot -->
    <path d="M36 12 C 36 2, 48 -2, 54 2 C 54 10, 44 14, 36 12 Z" fill="url(#ecoGreen)" filter="url(#softGlow)" />
    <path d="M39 9 L49 4" stroke="#D1FAE5" stroke-width="1" stroke-linecap="round" />

    <!-- Weave Cross Hatch -->
    <line x1="22" y1="34" x2="50" y2="34" stroke="#FFF" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <line x1="24" y1="44" x2="48" y2="44" stroke="#FFF" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>
