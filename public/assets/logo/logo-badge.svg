<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#D4A359" />
      <stop offset="100%" stop-color="#8C5C26" />
    </linearGradient>
    <linearGradient id="badgeDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E332B" />
      <stop offset="100%" stop-color="#09130F" />
    </linearGradient>
    <linearGradient id="ecoGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <path id="textCircleTop" d="M 30,120 A 90,90 0 0,1 210,120" />
    <path id="textCircleBottom" d="M 210,120 A 90,90 0 0,1 30,120" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&amp;display=swap');
      .seal-text {
        font-family: 'Poppins', sans-serif;
        font-size: 10.5px;
        font-weight: 700;
        fill: #FDE68A;
        letter-spacing: 0.16em;
      }
      .seal-center {
        font-family: 'Poppins', sans-serif;
        font-size: 8px;
        font-weight: 700;
        fill: #FFFFFF;
        letter-spacing: 0.2em;
      }
    </style>
  </defs>

  <!-- Outer Ring with Notches -->
  <circle cx="120" cy="120" r="115" fill="url(#badgeDark)" stroke="url(#badgeGold)" stroke-width="3" />
  <circle cx="120" cy="120" r="105" fill="none" stroke="#D4A359" stroke-width="1" stroke-dasharray="3,3" />
  
  <!-- Text Along Arc (Top) -->
  <text class="seal-text">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      NORTH BENGAL HANDMADE PRODUCTS
    </textPath>
  </text>

  <!-- Text Along Arc (Bottom) -->
  <text class="seal-text">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      ★ GOVT. VERIFIED EXPORTER ★
    </textPath>
  </text>

  <!-- Inner Center Circle -->
  <circle cx="120" cy="120" r="70" fill="#0C1411" stroke="url(#badgeGold)" stroke-width="2" />

  <!-- Center Emblem (NB Knot & Leaf) -->
  <g transform="translate(86, 74)">
    <path d="M12 28 C 12 18, 24 12, 35 12 C 46 12, 58 18, 58 28 C 58 42, 35 46, 35 58" fill="none" stroke="url(#badgeGold)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M35 14 L35 58" fill="none" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round" />
    <path d="M58 40 C 58 52, 46 58, 35 58 C 24 58, 12 52, 12 40" fill="none" stroke="url(#badgeGold)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M35 28 C 47 28, 55 33, 55 42 C 55 50, 47 56, 35 56" fill="none" stroke="#FBBF24" stroke-width="3.5" stroke-linecap="round" />
    <path d="M35 12 C 35 2, 47 -2, 53 2 C 53 10, 43 14, 35 12 Z" fill="url(#ecoGreen)" />
  </g>

  <!-- Sub Text inside Seal -->
  <text x="120" y="162" text-anchor="middle" class="seal-center">
    ESTD. 2022 • BANGLADESH
  </text>
  <text x="120" y="174" text-anchor="middle" class="seal-center" fill="#CAA875" font-size="7">
    ERC: 260326211291422
  </text>
</svg>
